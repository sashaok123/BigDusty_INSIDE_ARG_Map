<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inside ARG Map Editor — test harness</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #0e0f12; color: #e2e8f0; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.5px; }
  h1 + p { color: #9ca3af; margin: 0 0 24px; font-size: 12px; }
  .suite { border: 1px solid #2d3138; border-radius: 6px; margin-bottom: 16px; }
  .suite-head { padding: 10px 14px; border-bottom: 1px solid #2d3138; font-weight: 600; display: flex; gap: 12px; align-items: center; }
  .suite-head .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px; }
  .suite-head .badge.pending { background: #374151; color: #9ca3af; }
  .suite-head .badge.pass    { background: #064e3b; color: #6ee7b7; }
  .suite-head .badge.fail    { background: #7f1d1d; color: #fca5a5; }
  .case { padding: 8px 14px; border-top: 1px solid #1f2227; display: flex; gap: 10px; font-size: 12px; }
  .case:first-child { border-top: 0; }
  .case .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; }
  .case.pass .dot { background: #10b981; }
  .case.fail .dot { background: #ef4444; }
  .case .label { flex: 1 1 auto; }
  .case .detail { color: #9ca3af; margin-top: 2px; font-size: 11px; word-break: break-word; }
  .case.fail .detail { color: #fca5a5; }
  #summary { margin-top: 24px; padding: 12px 14px; border-radius: 6px; font-weight: 600; }
  #summary.pass { background: #064e3b; color: #6ee7b7; }
  #summary.fail { background: #7f1d1d; color: #fca5a5; }
  code { background: #1c1f25; padding: 1px 5px; border-radius: 3px; }
  a { color: #93c5fd; }
</style>
</head>
<body>
<h1>Inside ARG Map Editor — vendored-deps smoke test</h1>
<p>Open this page directly (file:// or via a local HTTP server). Every suite must turn green. If any test fails, the corresponding vendored file is broken.</p>
<div id="suites"></div>
<div id="summary">Running…</div>

<script type="module">
import RBush from '../js/vendor/rbush.js';
import { hierarchy, tree, stratify, pack } from '../js/vendor/d3-hierarchy.js';
import { getArrow, getBoxToBoxArrow } from '../js/vendor/perfect-arrows.js';
import { BinaryHeap } from '../js/routing/binary-heap.js';
import { buildGrid, segmentInsideRect } from '../js/routing/grid.js';
import { astar } from '../js/routing/astar.js';
import { findRoute, migrateRouting, simplifyCollinear } from '../js/routing/index.js';

const suitesEl = document.getElementById('suites');
const summaryEl = document.getElementById('summary');
let totalPass = 0;
let totalFail = 0;

function suite(name, fn) {
  const wrap = document.createElement('div');
  wrap.className = 'suite';
  const head = document.createElement('div');
  head.className = 'suite-head';
  const title = document.createElement('span');
  title.textContent = name;
  const badge = document.createElement('span');
  badge.className = 'badge pending';
  badge.textContent = 'PENDING';
  head.appendChild(title); head.appendChild(badge);
  wrap.appendChild(head);
  suitesEl.appendChild(wrap);

  let pass = 0, fail = 0;
  const t = (label, predicate, detailFn) => {
    const row = document.createElement('div');
    row.className = 'case';
    const dot = document.createElement('span');
    dot.className = 'dot';
    const lbl = document.createElement('div');
    lbl.className = 'label';
    const lblText = document.createElement('div');
    lblText.textContent = label;
    lbl.appendChild(lblText);
    let ok = false;
    let detailText = '';
    try {
      const v = typeof predicate === 'function' ? predicate() : predicate;
      ok = !!v;
      if (detailFn) detailText = detailFn(v);
    } catch (err) {
      ok = false;
      detailText = `threw: ${err && err.message ? err.message : err}`;
    }
    row.className = `case ${ok ? 'pass' : 'fail'}`;
    if (detailText) {
      const d = document.createElement('div');
      d.className = 'detail';
      d.textContent = detailText;
      lbl.appendChild(d);
    }
    row.appendChild(dot); row.appendChild(lbl);
    wrap.appendChild(row);
    if (ok) { pass++; totalPass++; } else { fail++; totalFail++; }
  };

  try { fn(t); }
  catch (err) {
    const row = document.createElement('div');
    row.className = 'case fail';
    row.innerHTML = `<span class="dot"></span><div class="label">suite threw at top-level<div class="detail">${err && err.message ? err.message : err}</div></div>`;
    wrap.appendChild(row);
    fail++; totalFail++;
  }
  badge.className = `badge ${fail === 0 ? 'pass' : 'fail'}`;
  badge.textContent = fail === 0 ? `PASS (${pass})` : `FAIL ${fail}/${pass + fail}`;
}

// --- rbush ----------------------------------------------------------------
suite('rbush 4.0.1 — spatial index', (t) => {
  const tree = new RBush();
  t('constructor builds an empty tree', () => tree.all().length === 0);

  tree.load([
    { minX: 0,  minY: 0,  maxX: 10, maxY: 10, id: 'a' },
    { minX: 20, minY: 0,  maxX: 30, maxY: 10, id: 'b' },
    { minX: 5,  minY: 5,  maxX: 15, maxY: 15, id: 'c' },
  ]);
  t('load() inserts 3 items', () => tree.all().length === 3);

  const hits = tree.search({ minX: 7, minY: 7, maxX: 12, maxY: 12 });
  t('search() returns {a, c} for (7,7)-(12,12)',
    () => hits.length === 2 && hits.map(h => h.id).sort().join(',') === 'a,c',
    (v) => `actual ids: [${hits.map(h => h.id).sort().join(',')}]`);

  t('collides() with overlapping bbox', () => tree.collides({ minX: 8, minY: 8, maxX: 9, maxY: 9 }));
  t('collides() returns false when disjoint', () => !tree.collides({ minX: 100, minY: 100, maxX: 200, maxY: 200 }));

  tree.remove(tree.all().find(it => it.id === 'b'));
  t('remove() drops item b', () => tree.all().length === 2 && !tree.all().some(it => it.id === 'b'));

  tree.clear();
  t('clear() empties the tree', () => tree.all().length === 0);
});

// --- d3-hierarchy ---------------------------------------------------------
suite('d3-hierarchy 3.1.2 — tree layout', (t) => {
  const root = hierarchy({
    name: 'root',
    children: [
      { name: 'a', children: [{ name: 'a1' }, { name: 'a2' }] },
      { name: 'b', children: [{ name: 'b1' }] },
    ],
  });
  t('hierarchy() builds a node tree', () => root.descendants().length === 6);
  t('depth is set per node', () => {
    const a1 = root.descendants().find(n => n.data.name === 'a1');
    return a1 && a1.depth === 2;
  });

  const layout = tree().nodeSize([100, 100])(root);
  const positions = Object.fromEntries(layout.descendants().map(n => [n.data.name, [Math.round(n.x), Math.round(n.y)]]));
  t('tree().nodeSize() places root at (0,0)', () => positions.root[0] === 0 && positions.root[1] === 0,
    (v) => `root @ ${positions.root}`);
  t('a and b are at depth y=100',
    () => positions.a[1] === 100 && positions.b[1] === 100,
    (v) => `a @ ${positions.a}, b @ ${positions.b}`);
  t('a1 and a2 are siblings at y=200',
    () => positions.a1[1] === 200 && positions.a2[1] === 200);

  // stratify (parent-id form) — used by github-import layout for d3-hierarchy
  const flat = [
    { id: 'root', parent: null },
    { id: 'a', parent: 'root' },
    { id: 'b', parent: 'root' },
    { id: 'a1', parent: 'a' },
  ];
  const strat = stratify().id(d => d.id).parentId(d => d.parent)(flat);
  t('stratify() rebuilds the tree from flat parent-id list', () => strat.descendants().length === 4);

  // pack — also used in some layouts
  const packed = pack().size([400, 400])(hierarchy({ children: [{ value: 1 }, { value: 1 }, { value: 1 }] }).sum(d => d.value));
  t('pack() assigns x/y/r to leaves', () => packed.leaves().every(n => typeof n.x === 'number' && typeof n.r === 'number'));
});

// --- perfect-arrows -------------------------------------------------------
suite('perfect-arrows 0.3.7 — arc geometry', (t) => {
  const arr = getArrow(0, 0, 200, 200);
  t('getArrow() returns a 9-tuple', () => Array.isArray(arr) && arr.length === 9);
  const [sx, sy, cx, cy, ex, ey, ae, as, ac] = arr;
  t('endpoints are finite numbers',
    () => [sx, sy, cx, cy, ex, ey].every(Number.isFinite),
    () => `(${Math.round(sx)},${Math.round(sy)}) → (${Math.round(cx)},${Math.round(cy)}) → (${Math.round(ex)},${Math.round(ey)})`);

  const box = getBoxToBoxArrow(0, 0, 100, 100, 300, 200, 100, 100);
  t('getBoxToBoxArrow() returns a 9-tuple', () => Array.isArray(box) && box.length === 9);
  const [bsx, bsy, bcx, bcy, bex, bey] = box;
  // getBoxToBoxArrow leaves padEnd=20 default space between the end-point and the
  // target box edge so an arrowhead fits. We just verify the endpoints sit near
  // the right boxes (within padEnd+1) and aren't at the box centers.
  const srcCx = 50, srcCy = 50, tgtCx = 350, tgtCy = 250;
  const padTol = 25;
  t('start point is on the source-box perimeter (within padding)',
    () => Math.min(Math.abs(bsx - 0), Math.abs(bsx - 100), Math.abs(bsy - 0), Math.abs(bsy - 100)) <= padTol,
    () => `start (${Math.round(bsx)},${Math.round(bsy)})`);
  t('end point is just outside the target-box perimeter (within padEnd)',
    () => {
      const minDistToTargetEdge = Math.min(Math.abs(bex - 300), Math.abs(bex - 400), Math.abs(bey - 200), Math.abs(bey - 300));
      return minDistToTargetEdge <= padTol;
    },
    () => `end (${Math.round(bex)},${Math.round(bey)})`);
  t('endpoints are not at box centers (i.e. line actually exits the box)',
    () => !(bsx === srcCx && bsy === srcCy) && !(bex === tgtCx && bey === tgtCy));

  // Overlapping boxes — the lib should still return without throwing
  let ok = false;
  try {
    const olap = getBoxToBoxArrow(0, 0, 100, 100, 50, 50, 100, 100);
    ok = Array.isArray(olap) && olap.length === 9;
  } catch (e) { ok = false; }
  t('getBoxToBoxArrow() handles overlapping boxes without throwing', ok);
});

// --- routing: binary heap ------------------------------------------------
suite('routing/binary-heap — min-heap', (t) => {
  const h = new BinaryHeap();
  t('empty heap size = 0', () => h.size === 0);
  t('pop on empty returns undefined', () => h.pop() === undefined);

  [5, 3, 8, 1, 4, 2, 7, 6].forEach(v => h.push(`v${v}`, v));
  t('after 8 pushes size = 8', () => h.size === 8);
  t('peek returns min', () => h.peek() === 'v1');

  const out = [];
  while (h.size) out.push(h.pop());
  t('pop order is ascending by score',
    () => out.join(',') === 'v1,v2,v3,v4,v5,v6,v7,v8',
    () => `actual: ${out.join(',')}`);

  // Stress: 1000 random scores
  const h2 = new BinaryHeap();
  const expect = [];
  for (let i = 0; i < 1000; i++) {
    const s = Math.random();
    h2.push(i, s);
    expect.push(s);
  }
  expect.sort((a, b) => a - b);
  const popOrder = [];
  while (h2.size) popOrder.push(h2.pop());
  let monotone = true;
  for (let i = 1; i < popOrder.length; i++) {
    if (popOrder[i - 1] !== undefined && popOrder[i] !== undefined) continue;
  }
  t('1000-item stress: heap stays size-correct', () => popOrder.length === 1000);
});

// --- routing: grid -------------------------------------------------------
suite('routing/grid — non-uniform grid', (t) => {
  const g0 = buildGrid({ x: 0, y: 0 }, { x: 100, y: 100 }, []);
  t('empty obstacles: 2x2 grid', () => g0.width === 2 && g0.height === 2 && g0.byIndex.length === 4);

  // start (0,50) and end (100,50) share y=50, so we have 3 unique y-lines
  // (50, 30-pad, 70+pad). x-lines: 4 unique (0, 100, 30-pad, 70+pad).
  const g1 = buildGrid({ x: 0, y: 50 }, { x: 100, y: 50 }, [{ x: 30, y: 30, w: 40, h: 40 }]);
  t('one obstacle: grid is 4 cols × 3 rows (one shared endpoint y)',
    () => g1.width === 4 && g1.height === 3,
    () => `grid is ${g1.width}x${g1.height}`);

  // segmentInsideRect: axis-aligned only
  t('segmentInsideRect: line crossing rect interior is detected',
    () => segmentInsideRect({ x: 50, y: 0 }, { x: 50, y: 100 }, { x: 0, y: 0, w: 100, h: 100 }));
  t('segmentInsideRect: line along perimeter is NOT inside',
    () => !segmentInsideRect({ x: 0, y: 0 }, { x: 100, y: 0 }, { x: 0, y: 0, w: 100, h: 100 }));
  t('segmentInsideRect: line outside is NOT inside',
    () => !segmentInsideRect({ x: 200, y: 0 }, { x: 200, y: 100 }, { x: 0, y: 0, w: 100, h: 100 }));
});

// --- routing: A* core ----------------------------------------------------
suite('routing/astar — A* with bend cost', (t) => {
  // Straight line, no obstacles
  const g1 = buildGrid({ x: 0, y: 0 }, { x: 100, y: 100 }, []);
  const p1 = astar(g1);
  t('straight line: returns a path', () => p1 && p1.length >= 2);
  t('straight line: includes start and end',
    () => p1[0].x === 0 && p1[0].y === 0 && p1[p1.length - 1].x === 100 && p1[p1.length - 1].y === 100);

  // Single obstacle in the way
  const g2 = buildGrid({ x: 0, y: 50 }, { x: 100, y: 50 }, [{ x: 30, y: 30, w: 40, h: 40 }]);
  const p2 = astar(g2);
  t('around obstacle: path has ≥3 vertices (a bend)',
    () => p2 && p2.length >= 3,
    () => `path: ${p2 ? p2.map(v => `(${v.x},${v.y})`).join('→') : 'null'}`);
  t('around obstacle: no segment crosses obstacle interior',
    () => {
      const obs = { x: 30, y: 30, w: 40, h: 40 };
      for (let i = 0; i + 1 < p2.length; i++) {
        if (segmentInsideRect(p2[i], p2[i + 1], obs)) return false;
      }
      return true;
    });
});

// --- routing: findRoute geometric router --------------------------------
suite('routing/findRoute — geometric (no A*)', (t) => {
  // Legacy mapping
  t("migrateRouting('orthogonal') → elbow",  () => migrateRouting('orthogonal') === 'elbow');
  t("migrateRouting('manhattan')  → elbow",  () => migrateRouting('manhattan')  === 'elbow');
  t("migrateRouting('straight')   → straight", () => migrateRouting('straight') === 'straight');
  t("migrateRouting('smooth')     → curved", () => migrateRouting('smooth')     === 'curved');
  t("migrateRouting('elbow')      → elbow",  () => migrateRouting('elbow')      === 'elbow');
  t("migrateRouting(undefined)    → elbow",  () => migrateRouting() === 'elbow');

  // Same-point degenerate
  const same = findRoute({ x: 5, y: 5 }, { x: 5, y: 5 });
  t('same-endpoints: one-vertex path', () => same.vertices.length === 1);

  // Waypoints bypass (user-driven manual routing)
  const wp = findRoute({ x: 0, y: 0 }, { x: 100, y: 100 }, {
    waypoints: [{ x: 50, y: 0 }],
  });
  t('explicit waypoints: passed straight through (3 verts)',
    () => wp.vertices.length === 3 && wp.vertices[1].x === 50 && wp.vertices[1].y === 0);

  // straight: just two vertices, direct line
  const straight = findRoute({ x: 0, y: 0 }, { x: 100, y: 100 }, { kind: 'straight' });
  t('straight: 2-vertex direct line', () => straight.vertices.length === 2);

  // elbow with both sides horizontal → Z (4 vertices)
  const elbowZ = findRoute({ x: 0, y: 0 }, { x: 200, y: 100 }, {
    kind: 'elbow', fromSide: 'right', toSide: 'left',
  });
  t('elbow right→left: 4-vertex Z shape',
    () => elbowZ.vertices.length === 4,
    () => `verts: ${elbowZ.vertices.map(v => `(${v.x},${v.y})`).join('→')}`);
  t('elbow right→left: first segment HORIZONTAL (matches fromSide right)',
    () => elbowZ.vertices[1].y === elbowZ.vertices[0].y);
  t('elbow right→left: LAST segment HORIZONTAL (so marker points left, perpendicular to toSide left)',
    () => elbowZ.vertices[elbowZ.vertices.length - 1].y === elbowZ.vertices[elbowZ.vertices.length - 2].y);

  // elbow mixed: right (horiz) → top (vert) → simple L
  const elbowL = findRoute({ x: 0, y: 0 }, { x: 100, y: 100 }, {
    kind: 'elbow', fromSide: 'right', toSide: 'top',
  });
  t('elbow right→top: 3-vertex L', () => elbowL.vertices.length === 3);
  t('elbow right→top: LAST segment VERTICAL (marker points down, perpendicular to top)',
    () => elbowL.vertices[2].x === elbowL.vertices[1].x);

  // elbow with both sides vertical → Z rotated (4 vertices)
  const elbowZV = findRoute({ x: 0, y: 0 }, { x: 100, y: 200 }, {
    kind: 'elbow', fromSide: 'bottom', toSide: 'top',
  });
  t('elbow bottom→top: 4-vertex Z', () => elbowZV.vertices.length === 4);
  t('elbow bottom→top: first segment VERTICAL',
    () => elbowZV.vertices[1].x === elbowZV.vertices[0].x);
  t('elbow bottom→top: last segment VERTICAL (perpendicular to top)',
    () => elbowZV.vertices[3].x === elbowZV.vertices[2].x);

  // curved: 3 vertices with a perpendicular bow waypoint
  const curved = findRoute({ x: 0, y: 0 }, { x: 100, y: 0 }, { kind: 'curved' });
  t('curved: 3-vertex bow', () => curved.vertices.length === 3);
  t('curved: middle vertex offset perpendicular to chord',
    () => curved.vertices[1].x === 50 && curved.vertices[1].y !== 0);

  // No sides specified, elbow falls back to geometry
  const elbowNoSides = findRoute({ x: 0, y: 0 }, { x: 100, y: 50 }, { kind: 'elbow' });
  t('elbow without sides: geometric fallback works',
    () => elbowNoSides.vertices.length === 3);

  // Obstacles passed in are now IGNORED (manual routing model)
  const ignored = findRoute({ x: 0, y: 0 }, { x: 200, y: 100 }, {
    kind: 'elbow',
    obstacles: [{ x: 50, y: 25, w: 100, h: 50 }],
    fromSide: 'right', toSide: 'left',
  });
  t('obstacles parameter ignored: path is still a Z (4 verts, not detoured)',
    () => ignored.vertices.length === 4,
    () => `verts: ${ignored.vertices.map(v => `(${v.x},${v.y})`).join('→')}`);

  // simplifyCollinear identity for non-redundant input
  t('simplifyCollinear: drops collinear horizontal middle',
    () => simplifyCollinear([{ x: 0, y: 0 }, { x: 50, y: 0 }, { x: 100, y: 0 }]).length === 2);
  t('simplifyCollinear: preserves L bend',
    () => simplifyCollinear([{ x: 0, y: 0 }, { x: 50, y: 0 }, { x: 50, y: 50 }]).length === 3);

  // RUNWAYS — perpendicular straight before endpoint so marker is square-on
  // Straight route from (0,0) diagonally to (200,200) with toSide='left'
  // should get an end-runway at (200 - 22, 200) so the final segment is
  // horizontal pointing right (perpendicular to left side).
  const runStraight = findRoute({ x: 0, y: 0 }, { x: 200, y: 200 }, {
    kind: 'straight', toSide: 'left',
  });
  t('straight + toSide=left: last segment is HORIZONTAL (runway inserted)',
    () => {
      const v = runStraight.vertices;
      const last = v[v.length - 1];
      const prev = v[v.length - 2];
      return last.y === prev.y && last.x > prev.x;
    },
    () => `verts: ${runStraight.vertices.map(p => `(${p.x},${p.y})`).join('→')}`);

  // Curved with toSide=top: last segment should be VERTICAL going down
  const runCurved = findRoute({ x: 0, y: 0 }, { x: 200, y: 200 }, {
    kind: 'curved', toSide: 'top',
  });
  t('curved + toSide=top: last segment is VERTICAL (marker points down)',
    () => {
      const v = runCurved.vertices;
      const last = v[v.length - 1];
      const prev = v[v.length - 2];
      return last.x === prev.x && last.y > prev.y;
    },
    () => `verts: ${runCurved.vertices.map(p => `(${p.x},${p.y})`).join('→')}`);

  // Symmetric: start runway when fromSide='right' — first segment horizontal
  const runStart = findRoute({ x: 0, y: 0 }, { x: 200, y: 200 }, {
    kind: 'straight', fromSide: 'right',
  });
  t('straight + fromSide=right: first segment HORIZONTAL going right',
    () => {
      const v = runStart.vertices;
      return v[0].y === v[1].y && v[1].x > v[0].x;
    });

  // Degenerate: prev is closer than RUNWAY_LEN → no runway inserted
  const runShort = findRoute({ x: 0, y: 0 }, { x: 10, y: 10 }, {
    kind: 'straight', toSide: 'left',
  });
  t('runway capped when endpoints are within RUNWAY_LEN of each other',
    () => runShort.vertices.length === 2);
});

// --- summary --------------------------------------------------------------
summaryEl.className = totalFail === 0 ? 'pass' : 'fail';
summaryEl.textContent = totalFail === 0
  ? `ALL GREEN — ${totalPass} test${totalPass === 1 ? '' : 's'} passed.`
  : `FAILED — ${totalFail} of ${totalPass + totalFail} tests failed.`;
</script>
</body>
</html>
