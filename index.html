<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_title">INSIDE ARG // Investigation Map</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/viewer.css">
  <link rel="stylesheet" href="css/arrows.css">
  <link rel="stylesheet" href="css/side-panel.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/markdown.css">
  <link rel="stylesheet" href="css/minimap.css">
  <link rel="stylesheet" href="css/outline.css">
  <link rel="stylesheet" href="css/command-palette.css">
  <link rel="stylesheet" href="css/theme-detective.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/editor-toolbar.css">
  <link rel="stylesheet" href="css/edit-modal.css">
  <link rel="stylesheet" href="css/context-menu.css">
</head>
<body>

<div id="toolbar">
  <div class="logo" data-i18n="app_logo">ARG//MAP</div>

  <div id="search-wrap">
    <input type="text" id="search" data-i18n-placeholder="toolbar_search_placeholder" placeholder="search hotspots..." autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
  </div>

  <div class="sep"></div>

  <button class="filter-btn active" data-filter="all"><span data-i18n="filter_all">All</span></button>
  <button class="filter-btn" data-filter="solved"><span class="status-dot dot-solved"></span><span data-i18n="filter_solved">Solved</span></button>
  <button class="filter-btn" data-filter="partial"><span class="status-dot dot-partial"></span><span data-i18n="filter_partial">Partial</span></button>
  <button class="filter-btn" data-filter="unsolved"><span class="status-dot dot-unsolved"></span><span data-i18n="filter_unsolved">Unsolved</span></button>
  <button class="filter-btn" data-filter="dead-end"><span class="status-dot dot-deadend"></span><span data-i18n="filter_dead_end">Dead end</span></button>
  <button class="filter-btn" data-filter="no-data"><span class="status-dot dot-nodata"></span><span data-i18n="filter_no_data">No Data</span></button>

  <div class="sep"></div>

  <div class="mode-switch">
    <button data-mode="viewer" class="active" data-i18n="mode_viewer">Viewer</button>
    <button data-mode="editor" data-i18n="mode_editor">Editor</button>
  </div>

  <div class="spacer"></div>

  <span id="realtime-status" class="offline" title="" aria-label="realtime status"></span>

  <div id="theme-switch" role="group" data-i18n-aria="theme_toggle_aria" aria-label="Theme">
    <button type="button" data-theme-value="light" data-i18n-title="theme_light" title="Light">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></svg>
    </button>
    <button type="button" data-theme-value="dark" data-i18n-title="theme_dark" title="Dark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button type="button" data-theme-value="auto" data-i18n-title="theme_auto" title="Auto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
  </div>

  <label id="lang-select-wrap" title="Language">
    <span class="lang-label" data-i18n="lang_label">Language</span>
    <select id="lang-select">
      <option value="en">EN</option>
      <option value="ru">RU</option>
      <option value="de">DE</option>
      <option value="it">IT</option>
      <option value="da">DA</option>
    </select>
  </label>

  <button class="tb-btn" id="btn-outline" data-i18n="outline_toggle">Outline</button>
  <button class="tb-btn" id="btn-minimap" data-i18n="minimap_toggle">Minimap</button>
  <button class="tb-btn" id="btn-palette" title="Ctrl+K">Cmd</button>
  <button class="tb-btn" id="btn-export" data-i18n="export_button">Export</button>
  <button class="tb-btn" id="btn-import" data-i18n="import_button">Import</button>
  <input type="file" id="file-import" accept=".canvas,.json" style="display:none">
  <button class="tb-btn" id="btn-reset" data-i18n="reset_defaults_button">Reset</button>
</div>

<div id="viewport">
  <canvas id="map-canvas"></canvas>
  <svg id="arrow-layer" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="hotspot-tooltip" style="position:fixed;background:var(--tooltip-bg);color:var(--tooltip-text);font-family:var(--font-mono);font-size:11px;padding:3px 8px;border:1px solid var(--panel-border);border-radius:3px;pointer-events:none;display:none;z-index:850;white-space:nowrap"></div>

<div id="zoom-controls">
  <button class="zoom-btn" id="btn-zoom-in" data-i18n-title="zoom_in" title="Zoom in">+</button>
  <div id="zoom-label">100%</div>
  <button class="zoom-btn" id="btn-zoom-out" data-i18n-title="zoom_out" title="Zoom out">&#8722;</button>
  <button class="zoom-btn" id="btn-zoom-fit" data-i18n-title="zoom_fit" title="Fit to screen">&#8862;</button>
</div>

<div id="panel">
  <button id="panel-close" type="button" data-i18n-aria="side_panel_close" aria-label="Close">&times;</button>
  <div id="panel-header">
    <div id="panel-status-row">
      <span id="panel-status-dot" class="status-dot"></span>
      <select id="panel-status-select"></select>
    </div>
    <div id="panel-title"></div>
    <div id="panel-tags"></div>
  </div>
  <div id="panel-body"></div>
  <div id="panel-footer">
    <button id="btn-edit-md" class="primary" type="button" data-i18n="side_panel_edit_md">Edit raw MD</button>
    <button id="btn-save-md" type="button" data-i18n="side_panel_save">Save</button>
    <button id="btn-export-md" type="button" data-i18n="side_panel_export_md">Export MD</button>
  </div>
  <div id="md-edit-overlay">
    <h3 data-i18n="editor_md_overlay_title">Edit Markdown</h3>
    <textarea id="md-edit-textarea" spellcheck="false"></textarea>
    <div id="md-edit-actions">
      <button id="md-edit-cancel" type="button" data-i18n="editor_cancel_button">Cancel</button>
      <button id="md-edit-save" class="primary" type="button" data-i18n="editor_md_apply">Apply</button>
    </div>
  </div>
</div>

<div id="editor-modal">
  <div id="editor-modal-box">
    <div id="editor-modal-header">
      <h2 id="editor-modal-header-title" data-i18n="editor_new_hotspot">Add hotspot</h2>
      <button id="editor-modal-close" type="button" data-i18n-aria="side_panel_close" aria-label="Close">&times;</button>
    </div>
    <div id="editor-modal-body">
      <div class="field-row">
        <div class="field-group">
          <label data-i18n="editor_title_label">Title *</label>
          <input type="text" id="field-title" data-i18n-placeholder="editor_title_placeholder" placeholder="e.g. Printer Easter Egg">
        </div>
        <div class="field-group">
          <label data-i18n="editor_slug_label">Slug</label>
          <input type="text" id="field-slug" data-i18n-placeholder="editor_slug_placeholder" placeholder="auto-from-title">
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label data-i18n="editor_status_label">Status</label>
          <select id="field-status"></select>
        </div>
        <div class="field-group">
          <label data-i18n="editor_tags_label">Tags (comma-separated)</label>
          <input type="text" id="field-tags" data-i18n-placeholder="editor_tags_placeholder" placeholder="e.g. stickers, iam8bit">
        </div>
      </div>
      <div class="field-group">
        <label data-i18n="editor_content_label">Initial markdown content</label>
        <textarea id="field-md" placeholder="# Title&#10;&#10;## Status&#10;..." style="min-height:200px"></textarea>
        <div class="field-hint" data-i18n="editor_content_hint">Will be cached under the slug. Use the side panel's "Edit raw MD" later to refine.</div>
      </div>
    </div>
    <div id="editor-modal-footer">
      <button class="modal-btn danger" id="editor-delete" data-i18n="editor_delete_button" style="display:none">Delete</button>
      <div class="spacer" style="flex:1"></div>
      <button class="modal-btn cancel" id="editor-cancel" data-i18n="editor_cancel_button">Cancel</button>
      <button class="modal-btn primary" id="editor-save" data-i18n="editor_save_button">Save</button>
    </div>
  </div>
</div>

<div id="confirm-modal">
  <div id="confirm-box">
    <h3 id="confirm-title">Confirm</h3>
    <p id="confirm-message"></p>
    <div id="confirm-actions"></div>
  </div>
</div>

<div id="toast"></div>

<div id="offline-banner" data-i18n="offline_banner">Working offline (local file)</div>

<div id="migration-banner">
  <span id="migration-banner-text" data-i18n="migration_banner_text">Older data files detected.</span>
  <button id="migration-banner-button" type="button" data-i18n="migration_banner_button">Save as canvas.canvas</button>
  <button id="migration-banner-dismiss" type="button" data-i18n="migration_banner_dismiss">Dismiss</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
