name: Canvas daily backup

"on":
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch live canvas snapshot
        run: |
          mkdir -p data
          curl --fail --silent --show-error \
               --max-time 60 \
               --retry 3 --retry-delay 5 \
               --output data/canvas_backup.canvas \
               "https://insideargmap-production.up.railway.app/canvas/main"

      - name: Pretty-print copy
        run: |
          python -c "import json,sys,pathlib; raw=pathlib.Path('data/canvas_backup.canvas').read_text(encoding='utf-8'); pathlib.Path('data/canvas_backup.pretty.json').write_text(json.dumps(json.loads(raw), indent=2, ensure_ascii=False)+'\n', encoding='utf-8')"

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Stage backup branch
        run: |
          git fetch origin backups/canvas || true
          git checkout -B backups/canvas
          git add -f data/canvas_backup.canvas data/canvas_backup.pretty.json
          if git diff --cached --quiet; then
            echo 'No backup changes today.'
            exit 0
          fi
          git commit -m 'automated daily canvas backup'
          git push --force origin backups/canvas
